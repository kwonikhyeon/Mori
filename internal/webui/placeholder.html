<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mori</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --line: #d2d2d7; --accent: #0a7d4f; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; --card: #1c1c1f; --line: #3a3a3d; --accent: #3ccf8e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  form { display: grid; gap: 10px; margin-top: 16px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Mori</h1>
  <p id="status">Mori 서버가 동작 중입니다. UI는 아직 설치되지 않았습니다.</p>
  <p id="host" class="muted"></p>
  <form id="pair" hidden>
    <label for="name">이 기기의 이름</label>
    <input id="name" name="name" maxlength="64" autocomplete="off" required>
    <button type="submit">페어링</button>
  </form>
  <p id="result" class="muted" role="status"></p>
</main>
<script src="/placeholder.js"></script>
</body>
</html>
